repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4   # Use latest stable at time of setup
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.4.2   # Use latest stable
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
