[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "datafarm"
version = "0.1.0"
dependencies = [
  "platformdirs>=4.5.1",
  "tomli-w>=1.2.0",
  "sqlalchemy>=2.0.46",
  "psycopg[binary]>=3.3.2",
]
description = "Schema-aware test data generation tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jason Alan Smith", email = "jason.alan.smith@outlook.com"},
  { name = "Data Farm Community" }]

maintainers = [
  {name = "Jason Alan Smith", email = "jason.alan.smith@outlook.com"}
]

keywords = [
  "testing",
  "test data",
  "qa",
  "cli",
  "PostgreSQL"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Environment :: Console"
]

[project.urls]
Repository = "https://github.com/PhoenixAnvil/data-farm-python"
Issues = "https://github.com/PhoenixAnvil/data-farm-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.15.2",
  "black>=26.1.0",
  "pre-commit>=4.5.1",
]

[project.scripts]
dfarm = "data_farm.l3_frameworks_and_drivers.cli.main:main"

[tool.black]
line-length = 125
target-version = ["py311"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
# Pick a strong-but-not-insane default set
select = [
  "E", "F",   # pycodestyle + pyflakes (basic correctness)
  "I",        # import sorting
  "B",        # bugbear (common footguns)
  "C4",       # comprehensions
  "UP",       # pyupgrade
  "SIM",      # simplifications
  "PL"        # pylint-ish rules (bigger net)
]

ignore = [
  "E203"      # common Black compatibility quirk
]

[tool.ruff.lint.mccabe]
# Complexity cap (like ESLint "complexity": 5)
max-complexity = 5

[tool.ruff.lint.pylint]
# Function size-ish guardrails
max-args = 10
max-branches = 10
max-returns = 10
max-statements = 15

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
